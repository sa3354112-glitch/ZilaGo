workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Show Pubspec
        script: |
          unzip -o ZilaGo-Nagina-Final.zip || true
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -name "pubspec_*.yaml" | head -n 1 | xargs dirname)
          cd $PROJECT_DIR
          echo "=== pubspec.yaml (718B wala) ==="
          cat pubspec.yaml
          echo ""
          echo "=== pubspec_1.yaml (1.02KB wala) ==="
          cat pubspec_1.yaml || cat ../pubspec_1.yaml || find . -name "pubspec_1.yaml" -exec cat {} \;
          echo ""
          echo "=== lib/services files ==="
          ls lib/services/
      - name: Build APK
        script: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -name "pubspec_*.yaml" | head -n 1 | xargs dirname)
          cd $PROJECT_DIR
          cp -f pubspec_1.yaml pubspec.yaml || true
          rm -f pubspec_1.yaml pubspec_2.yaml pubspec_3.yaml
          flutter clean
          flutter create . --platforms=android --org com.zilago.nagina --project-name zilago_nagina
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
