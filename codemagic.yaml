workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
    scripts:
      - name: Install
        script: |
          npm install
      - name: Build APK
        script: |
          npx expo prebuild --platform android --clean || true
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
