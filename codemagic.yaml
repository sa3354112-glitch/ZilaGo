workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK
        script: |
          unzip -o ZilaGo-Nagina-Final.zip || true
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -name "pubspec_*.yaml" | head -n 1 | xargs dirname)
          echo "Project: $PROJECT_DIR"
          cd $PROJECT_DIR
          rm -f pubspec_1.yaml pubspec_2.yaml pubspec_3.yaml
          ls -la
          flutter clean
          flutter create . --platforms=android --org com.zilago.nagina --project-name zilago_nagina
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
