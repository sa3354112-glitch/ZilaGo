workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK
        script: |
          unzip -o ZilaGo-Nagina-Final.zip || true
          PROJECT_DIR=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cd $PROJECT_DIR
          flutter create . --platforms=android --org com.zilago.nagina --project-name zilago_nagina
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
