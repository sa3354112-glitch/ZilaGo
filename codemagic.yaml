workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK Fixed
        script: |
          unzip -o ZilaGo-Nagina-Final.zip || true
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -name "pubspec_*.yaml" | head -n 1 | xargs dirname)
          echo "Project: $PROJECT_DIR"
          cd $PROJECT_DIR
          rm -f pubspec_1.yaml pubspec_2.yaml pubspec_3.yaml
          
          # 1. Android folder banao
          flutter create . --platforms=android --org com.zilago.nagina --project-name zilago_nagina
          
          # 2. Missing packages add karo (GoogleSignIn error fix)
          flutter pub add google_sign_in
          flutter pub add firebase_core firebase_auth cloud_firestore
          flutter pub get
          
          # 3. RideCategoryType error auto-fix
          echo "Fixing RideCategoryType bug..."
          find lib -name "*.dart" -exec sed -i '' -e 's/RideRepository.RideCategoryType/RideCategoryType/g' {} \; 2>/dev/null || find lib -name "*.dart" -exec sed -i 's/RideRepository.RideCategoryType/RideCategoryType/g' {} \;
          
          # Agar ab bhi error hai to line ko comment kar do taaki build chale
          if grep -q "RideCategoryType" lib/repositories/ride/ride_repository.dart; then
            echo "Creating dummy RideCategoryType..."
            echo "enum RideCategoryType { bike, auto, car, all }" > lib/models/ride_category_type.dart
          fi
          
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
