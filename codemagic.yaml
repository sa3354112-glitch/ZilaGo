workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22.13.0
      java: 17
    scripts:
      - name: Unzip Project
        script: |
          echo "Listing files..."
          ls -la
          echo "Unzipping..."
          unzip -o ZilaGo-Nagina-Final.zip || unzip -o "*.zip" || true
          echo "After unzip:"
          ls -la
          find . -maxdepth 4 -name "package.json" -not -path "*/node_modules/*"
      - name: Build APK
        script: |
          PROJECT_DIR=$(find . -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Project dir is: $PROJECT_DIR"
          cd $PROJECT_DIR
          npm install --legacy-peer-deps
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "**/android/app/build/outputs/apk/release/*.apk"
