workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Debug Code
        script: |
          unzip -o ZilaGo-Nagina-Final.zip || true
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -name "pubspec_*.yaml" | head -n 1 | xargs dirname)
          cd $PROJECT_DIR
          echo "==== PUBSPEC ===="
          cat pubspec.yaml
          echo ""
          echo "==== ride_repository.dart LINE 395-410 ===="
          sed -n '390,420p' lib/repositories/ride/ride_repository.dart
          echo ""
          echo "==== auth_service.dart LINE 1-20 ===="
          sed -n '1,25p' lib/services/auth_service.dart
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
