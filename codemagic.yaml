workflows:
  zilago-apk:
    name: ZilaGo APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK Fixed
        script: |
          unzip -o ZilaGo-Nagina-Final.zip || true
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -name "pubspec_*.yaml" | head -n 1 | xargs dirname)
          cd $PROJECT_DIR
          rm -f pubspec_1.yaml pubspec_2.yaml pubspec_3.yaml
          
          flutter create . --platforms=android --org com.zilago.nagina --project-name zilago_nagina
          
          # 🔒 Purane stable versions lock karo - ye tere code se 100% match karenge
          flutter pub add google_sign_in:6.2.1
          flutter pub add google_maps_flutter:2.9.0
          flutter pub add firebase_core:2.24.0 firebase_auth:4.15.3 cloud_firestore:4.15.5
          
          # RideCategoryType fix
          find lib -type f -name "*.dart" -exec sed -i '' -e 's/RideRepository\.RideCategoryType/RideCategoryType/g' {} \; 2>/dev/null || find lib -type f -name "*.dart" -exec sed -i 's/RideRepository\.RideCategoryType/RideCategoryType/g' {} \;
          
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
