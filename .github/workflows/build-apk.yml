name: Build ZilaGo APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o ZilaGo-Nagina-Final.zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Build APK
        run: |
          DIR=$(find. -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project found at: $DIR"
          cd "$DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZilaGo-APK
          path: '**/app-release.apk'
